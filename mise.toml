[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
prek = "0.5.3"
python = "3.14.7"
uv = "0.12.15"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

# Single prek leaf. `ci`/`lint`/`fmt` used to duplicate this command; they
# were removed rather than kept as compatibility aliases (AGENTS.md: no
# shims). Generated velnor-workflow CI does not call mise tasks (generic
# profile, docker unit only).
[tasks.test]
description = "Run the repository test gate"
run = "prek run --all-files"
