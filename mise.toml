[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
prek = "0.5.0"
python = "3.14.7"
uv = "0.12.7"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

# `test` is the only leaf. `ci`/`lint`/`fmt` are depends-only aliases so
# `mise run <name>` stays valid. Generated velnor-workflow CI does not call
# these (generic profile, docker unit only). Do not list all four as
# ci_tasks/check_profile tasks: each `mise run` is a separate process.
[tasks.test]
description = "Run the repository test gate"
run = "prek run --all-files"

[tasks.ci]
description = "Depends-only alias of test"
depends = ["test"]

[tasks.lint]
description = "Depends-only alias of test"
depends = ["test"]

[tasks.fmt]
description = "Depends-only alias of test"
depends = ["test"]
