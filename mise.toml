[tools]
jactionlint = "2.3.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
prek = "0.5.9"
python = "3.15.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.13.6"
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

[tasks.test]
description = "Run the repository test gate"
run = "prek run --all-files"
tools = { gitleaks = "8.30.1", hadolint = "2.15.1", prek = "0.5.9", shellcheck = "0.11.0", shfmt = "3.14.1" }
