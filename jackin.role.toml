version = 1
dockerfile = "Dockerfile"
published_image = "docker.io/projectjackin/jackin-agent-smith:latest"
agents = ["claude"]

[identity]
name = "Agent Smith"

[claude]
plugins = [
  "code-review@claude-plugins-official",
  "feature-dev@claude-plugins-official",
]

[env.CLAUDE_CODE_NO_FLICKER]
default = "1"
