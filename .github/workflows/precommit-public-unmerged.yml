name: pre-commit (public unmerged)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

concurrency:
  group: precommit-public-unmerged-${{ github.ref }}
  cancel-in-progress: true

# Both lanes run the SAME steps with the SAME toolchain; only runs-on differs.
# pull_request routes to the GitHub lane (ubuntu-26.04) so PR checks never wait
# on the self-hosted fleet; workflow_dispatch keeps Velnor as the default lane.

jobs:
  prek:
    name: Pre-commit (Velnor)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lanes != 'github' }}
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.16"
          install_args: prek
          cache_save: false
          github_token: ${{ github.token }}
      - run: prek run --all-files

  prek-github:
    name: Pre-commit (GitHub)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor' }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.16"
          install_args: prek
          cache_save: false
          github_token: ${{ github.token }}
      - run: prek run --all-files

  precommit-required:
    needs: [prek, prek-github]
    if: always()
    name: Pre-commit required (Velnor)
    permissions: {}
    # Headroom for fleet admission/finalization: the gate itself takes seconds,
    # but a short timeout previously killed it while the fleet was saturated.
    timeout-minutes: 15
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON" | jq -e '[to_entries[].value.result] as $r | ($r | any(. == "failure" or . == "cancelled") | not) and ($r | any(. == "success"))' >/dev/null
