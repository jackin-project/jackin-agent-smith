name: reuse-compliance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
permissions:
  contents: read
concurrency:
  group: reuse-compliance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both lanes run the SAME steps with the SAME toolchain; only runs-on differs.
# Fleet admission rejects post-merge push jobs on Velnor (merged_push_occupancy)
# so open PRs keep the fleet, therefore push events route to the GitHub lane;
# every other event defaults to Velnor. The GitHub-hosted label lives in the
# matrix include so that no runs-on line carries a GitHub-hosted literal:
# Velnor is the only literal runner default.

jobs:
  reuse:
    name: REUSE (Velnor)
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.lanes != 'github') }}
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.12"
          install_args: python uv pipx:reuse
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: REUSE Compliance Check
        run: reuse lint

  reuse-github:
    name: REUSE (GitHub)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.12"
          install_args: python uv pipx:reuse
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: REUSE Compliance Check
        run: reuse lint
