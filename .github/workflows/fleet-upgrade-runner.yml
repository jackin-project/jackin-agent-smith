# One-shot: install velnor-runner 0.1.115 on the executing host and restart
# daemons so capability manifest admits jackin-role-action@889e01e1.
name: fleet-upgrade-runner

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    name: Install velnor-runner 0.1.115 (Velnor host)
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 15
    steps:
      - name: Install deb and restart daemons
        run: |
          set -euo pipefail
          TAG=v0.1.115
          DEB="velnor-runner-0.1.115-x86_64-unknown-linux-gnu.deb"
          URL="https://github.com/tailrocks/velnor/releases/download/${TAG}/${DEB}"
          echo "host=$(hostname) uid=$(id -u) before=$(velnor-runner --version 2>/dev/null || true)"
          curl -fsSL -o "/tmp/${DEB}" "$URL"
          sha256sum "/tmp/${DEB}"
          dpkg -i "/tmp/${DEB}" || apt-get install -f -y
          echo "after_dpkg=$(velnor-runner --version 2>/dev/null || dpkg -l velnor-runner | tail -1)"
          # Restart estate daemons; this slot may be recycled by the restart.
          systemctl list-units 'velnor-daemon@*' --all --no-pager || true
          for u in $(systemctl list-units 'velnor-daemon@*' --all --no-legend 2>/dev/null | awk '{print $1}'); do
            echo "restarting $u"
            systemctl restart "$u" || true
          done
          echo "upgrade script finished"
