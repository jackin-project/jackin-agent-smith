repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks dir --redact --no-banner .
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        files: ^hooks/[^/]+\.sh$
      - id: shfmt
        name: shfmt
        language: system
        entry: shfmt -d -i 4 -ci
        files: ^hooks/[^/]+\.sh$
      - id: hadolint
        name: hadolint
        language: system
        entry: hadolint
        files: ^Dockerfile$
